name: Job Search Radar & Briefing

on:
  schedule:
    # 4-Hour Cadence: 01:17, 05:17, 09:17, 13:17, 17:17, 21:17 UTC (Offset to :17 to guarantee queue execution)
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  dispatch-briefing:
    runs-on: ubuntu-latest
    name: Fetch & Send Job Search Briefing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore SQLite Seen Jobs Cache
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jobs-db-${{ runner.os }}-

      - name: Run Job Search Radar (4-Hour Briefing Digest)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          USER_PROFILE: ${{ secrets.USER_PROFILE }}
          TARGET_COMPANIES: ${{ secrets.TARGET_COMPANIES }}
          TARGET_ROLES: ${{ secrets.TARGET_ROLES }}
        run: |
          echo "⏱️ 4-Hour Testing Cadence: fetching positions across target companies and sending briefing email..."
          python3 run.py --send

      - name: Save Updated SQLite Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/jobs.db
          key: jobs-db-${{ runner.os }}-${{ github.run_id }}
