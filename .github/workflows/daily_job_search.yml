name: Daily Job Search Briefing

on:
  schedule:
    # 8:05 AM Pacific Time (15:05 UTC) - Morning Full Briefing (Offset by 5m to avoid top-of-hour congestion)
    - cron: '5 15 * * *'
    # 6:05 PM Pacific Time (01:05 UTC) - Evening Flash Alert (Offset by 5m to avoid top-of-hour congestion)
    - cron: '5 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  dispatch-briefing:
    runs-on: ubuntu-latest
    name: Fetch & Send Job Search Briefing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore SQLite Seen Jobs Cache
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jobs-db-${{ runner.os }}-

      - name: Run Job Search Radar (Morning Full Briefing or Evening Flash Alert)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          USER_PROFILE: ${{ secrets.USER_PROFILE }}
        run: |
          # If triggered by 01:05 UTC cron (6:05 PM PT), run flash jobs-only with Zero-Spam Guard
          if [ "${{ github.event.schedule }}" = "5 1 * * *" ]; then
            echo "⚡ Evening Flash Alert triggered (6:05 PM PT): running with --only-if-jobs --no-news"
            python3 run.py --send --only-if-jobs --no-news
          else
            echo "🌅 Morning Full Briefing triggered (8:05 AM PT): running with news digest"
            python3 run.py --send
          fi

      - name: Save Updated SQLite Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/jobs.db
          key: jobs-db-${{ runner.os }}-${{ github.run_id }}
