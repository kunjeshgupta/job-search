name: Job Search Radar & Briefing

on:
  schedule:
    # Morning Full Briefing: 14:40 UTC (7:40 AM PT) -> lands by ~8:00 AM PT (includes market intelligence)
    - cron: '40 14 * * *'
    # Evening Flash Alert: 00:40 UTC (5:40 PM PT) -> lands by ~6:00 PM PT (flash jobs-only alert with Zero-Spam Guard)
    - cron: '40 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  dispatch-briefing:
    runs-on: ubuntu-latest
    name: Fetch & Send Job Search Briefing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore SQLite Seen Jobs Cache
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jobs-db-${{ runner.os }}-

      - name: Run Job Search Radar (Morning Full Briefing or Evening Flash Alert)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          USER_PROFILE: ${{ secrets.USER_PROFILE }}
          TARGET_COMPANIES: ${{ secrets.TARGET_COMPANIES }}
          TARGET_ROLES: ${{ secrets.TARGET_ROLES }}
        run: |
          # If triggered by 00:40 UTC cron (5:40 PM PT), run evening flash alert with Zero-Spam Guard
          if [ "${{ github.event.schedule }}" = "40 0 * * *" ]; then
            echo "⚡ Evening Flash Alert triggered: running with --only-if-jobs --no-news"
            python3 run.py --send --only-if-jobs --no-news
          else
            echo "🌅 Morning Full Briefing triggered: running full briefing with news digest"
            python3 run.py --send
          fi

      - name: Save Updated SQLite Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/jobs.db
          key: jobs-db-${{ runner.os }}-${{ github.run_id }}
